{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Store Schedule</h2>
<!-- 加在 schedule.html 的 <h2> 下面 -->
<form action="/add_schedule" method="POST" class="mb-3 d-flex gap-2">
    <!-- 这里的下拉框你们最好用 Jinja2 循环把 employees 传过来，或者直接写死演示 -->
    <select name="employee_id" class="form-control w-25" required>
        <option value="">-- Select Employee --</option>
        {% for emp in employees %}
            <option value="{{ emp['id'] }}">{{ emp['name'] }} (ID: {{ emp['id'] }})</option>
        {% endfor %}
    </select>
    <input type="date" name="date" required class="form-control w-25">
    <select name="shift_type" class="form-control w-25">
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
    </select>
    <button type="submit" class="btn btn-success">Assign Shift</button>
</form>
<table class="table table-bordered bg-white shadow-sm">
    <thead class="table-info">
        <tr>
            <th>Employee Name</th>
            <th>Date</th>
            <th>Shift Type</th>
        </tr>
    </thead>
    <tbody>
        {% for s in schedules %}
        <tr>
            <td>{{ s['name'] }}</td>
            <td>{{ s['date'] }}</td>
            <td><span class="badge bg-primary">{{ s['shift_type'] }}</span></td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" class="text-center">No schedules found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
