{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Dashboard Overview</h2>
<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card text-white bg-primary shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Total Employees</h5>
                <!-- 这里显示从后端传来的数字 -->
                <h1 class="display-4">{{ emp_count }}</h1> 
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card text-white bg-success shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Total Shifts Assigned</h5>
                <h1 class="display-4">{{ shift_count }}</h1>
            </div>
        </div>
    </div>
</div>
<div class="mt-4">
    <a href="/employees" class="btn btn-outline-primary">Manage Employees</a>
    <a href="/schedule" class="btn btn-outline-success">Manage Schedules</a>
</div>
{% endblock %}
